[package]
name = "fsnitch-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fsnitch-gui"
path = "src/main.rs"

[dependencies]
fsnitch-core = { path = "../fsnitch-core" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
async-channel = "2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "fsnitch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fsnitch"
path = "src/main.rs"

[dependencies]
fsnitch-core = { path = "../fsnitch-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["user"] }

[package]
name = "fsnitchd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fsnitch-core = { path = "../fsnitch-core" }
anyhow = "1"
nix = { version = "0.30", features = ["fanotify", "socket", "user", "fs", "inotify", "poll"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
libc = { version = "0.2.186", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
session-hardening = ["dep:libc"]
